model:
  name: sgd_classifier
  classes: [0, 1]
  loss: log_loss
  alpha: 0.0001
  random_state: 42

conformal:
  enabled: false

drift_detector:
  enabled: true
  name: baseline
  warmup_size: 50
  threshold_std: 3.0
  consecutive: 3
  visualizer: true

dataset:
  name: synthetic_drift
  seed: 42
  n_per_phase: 1000
  n_phases: 4
  n_features: 10
  noise_std: 0.6
  drift_angle: 1.5707963267948966
