model:
  name: simple_cnn
  num_classes: 10
  device: auto
  checkpoint_path: artifacts/models/simplecnn_cifar10_seed42_ep10.pt
  force_retrain: false
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]
  dropout: 0.4
  training:
    auto_train: false
    clean_root: data
    seed: 42
    epochs: 10
    batch_size: 128
    calibration_size: 5000
    num_workers: 0
    accelerator: auto
    devices: auto
    lr: 0.001
    weight_decay: 0.0001
    scheduler: cosine_annealing

conformal:
  name: classification
  enabled: true
  alpha: 0.1
  window_size: 500
  min_online_samples: 50
  min_samples_per_class: 10

drift_detector:
  name: baseline
  warmup_size: 50
  threshold_std: 3.0
  consecutive: 3

# Lowest baseline: active learning disabled so model weights remain strictly frozen
active_policy:
  enabled: false

dataset:
  name: cifar10c_stream
  data_dir: data
  clean_root: data
  channel_first: false
  normalize: false
  dtype: float32

  segments:
    - name: clean_cifar10
      corruption: clean
      count: 1000
      start: 0
